workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - lint
  - test
  - sonar
  - build
  - deploy
  - gitops
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE_NAME: "$NEXUS_REGISTRY/threepod/backend"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  GITOPS_COMPONENT: "backend"

.default_python:
  image: python:3.11-slim
  tags:
    - threepod
    - ci
    - test
    - sonar
  cache:
    key: "$CI_PROJECT_NAME-pip"
    paths:
      - .cache/pip
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements-dev.txt
    - ln -sfn "$CI_PROJECT_DIR" "$CI_PROJECT_DIR/../Back"

lint:
  extends: .default_python
  stage: lint
  script:
    - ruff check .

test:
  extends: .default_python
  stage: test
  variables:
    DATABASE_URL: "sqlite:////tmp/threepod_backend_test.db"
    DB_CONNECT_RETRIES: "1"
  script:
    - pytest --cov=Back --cov-report=xml --cov-report=term
  artifacts:
    when: always
    paths:
      - coverage.xml
    expire_in: 1 week

sonarqube:
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  stage: sonar
  tags:
    - threepod
    - ci
    - test
    - sonar
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "$CI_PROJECT_NAME-sonar"
    paths:
      - .sonar/cache
  script:
    - >-
      sonar-scanner
      -Dsonar.projectKey="$SONAR_PROJECT_KEY"
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
      -Dsonar.sources=.
      -Dsonar.exclusions=tests/**
      -Dsonar.tests=tests
      -Dsonar.python.coverage.reportPaths=coverage.xml
  needs:
    - test
  rules:
    - if: '$SONAR_TOKEN && $SONAR_HOST_URL && $SONAR_PROJECT_KEY'

build_image:
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  stage: build
  tags:
    - threepod
    - build
    - image
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$NEXUS_REGISTRY\":{\"username\":\"$NEXUS_USERNAME\",\"password\":\"$NEXUS_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$IMAGE_NAME:$IMAGE_TAG"
      --destination "$IMAGE_NAME:$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      variables:
        IMAGE_TAG: "$CI_COMMIT_TAG"
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+/'
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_development:
  image: alpine:3.22
  stage: deploy
  tags:
    - threepod
    - build
    - image
  needs:
    - build_image
  resource_group: threepod-development
  environment:
    name: development
    url: https://api.dev.threepod.langome.academy
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 "$HOME/.ssh"
    - cp "$DEV_SSH_KNOWN_HOSTS" "$HOME/.ssh/known_hosts"
    - chmod 600 "$DEV_SSH_PRIVATE_KEY" "$HOME/.ssh/known_hosts"
  script:
    - cp "$DEV_BACKEND_ENV" .deploy.env
    - printf '\nBACKEND_IMAGE=%s\nAPP_VERSION=dev-%s\n' "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_TAG" >> .deploy.env
    - ssh -i "$DEV_SSH_PRIVATE_KEY" -p "$DEV_DEPLOY_PORT" "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" "mkdir -p '$DEV_DEPLOY_PATH/backend'"
    - scp -i "$DEV_SSH_PRIVATE_KEY" -P "$DEV_DEPLOY_PORT" deploy/compose.yml "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST:$DEV_DEPLOY_PATH/backend/compose.yml"
    - scp -i "$DEV_SSH_PRIVATE_KEY" -P "$DEV_DEPLOY_PORT" .deploy.env "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST:$DEV_DEPLOY_PATH/backend/.env.next"
    - ssh -i "$DEV_SSH_PRIVATE_KEY" -p "$DEV_DEPLOY_PORT" "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" "chmod 600 '$DEV_DEPLOY_PATH/backend/.env.next' && mv '$DEV_DEPLOY_PATH/backend/.env.next' '$DEV_DEPLOY_PATH/backend/.env'"
    - printf '%s' "$NEXUS_PASSWORD" | ssh -i "$DEV_SSH_PRIVATE_KEY" -p "$DEV_DEPLOY_PORT" "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" "docker login '$NEXUS_REGISTRY' --username '$NEXUS_USERNAME' --password-stdin"
    - ssh -i "$DEV_SSH_PRIVATE_KEY" -p "$DEV_DEPLOY_PORT" "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" "cd '$DEV_DEPLOY_PATH/backend' && docker compose pull && docker compose up -d"
    - ssh -i "$DEV_SSH_PRIVATE_KEY" -p "$DEV_DEPLOY_PORT" "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" "curl --fail --silent --show-error --retry 12 --retry-delay 5 http://127.0.0.1:8000/health/ready"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

update_staging_gitops:
  image:
    name: mikefarah/yq:4.47.2
    entrypoint: [""]
    docker:
      user: "0"
  stage: gitops
  tags:
    - threepod
    - ci
    - test
    - sonar
  variables:
    GIT_STRATEGY: none
    GITOPS_FILE_ENCODED: "environments%2Fstaging%2Fbackend-image.yaml"
  needs:
    - build_image
  before_script:
    - apk add --no-cache curl jq
    - test -n "$GITOPS_API_TOKEN"
    - test -n "$GITOPS_PROJECT_ID"
    - test -n "$GITOPS_API_URL"
  script:
    - export GITOPS_BRANCH="gitops/staging/${GITOPS_COMPONENT}-${CI_COMMIT_SHORT_SHA}-${CI_JOB_ID}"
    - |
      curl --fail-with-body --silent --show-error \
        --request POST \
        --header "PRIVATE-TOKEN: $GITOPS_API_TOKEN" \
        --data-urlencode "branch=$GITOPS_BRANCH" \
        --data-urlencode "ref=main" \
        "$GITOPS_API_URL/projects/$GITOPS_PROJECT_ID/repository/branches" \
        > branch-response.json
    - |
      curl --fail-with-body --silent --show-error \
        --header "PRIVATE-TOKEN: $GITOPS_API_TOKEN" \
        --get \
        --data-urlencode "ref=$GITOPS_BRANCH" \
        "$GITOPS_API_URL/projects/$GITOPS_PROJECT_ID/repository/files/$GITOPS_FILE_ENCODED/raw" \
        --output gitops-values.yaml
    - yq -i '.backend.image.tag = strenv(IMAGE_TAG)' gitops-values.yaml
    - test "$(yq '.backend.image.tag' gitops-values.yaml)" = "$IMAGE_TAG"
    - |
      curl --fail-with-body --silent --show-error \
        --request PUT \
        --header "PRIVATE-TOKEN: $GITOPS_API_TOKEN" \
        --form "branch=$GITOPS_BRANCH" \
        --form "commit_message=chore(staging): deploy backend ${IMAGE_TAG}" \
        --form "content=<gitops-values.yaml" \
        "$GITOPS_API_URL/projects/$GITOPS_PROJECT_ID/repository/files/$GITOPS_FILE_ENCODED" \
        > commit-response.json
    - |
      curl --fail-with-body --silent --show-error \
        --request POST \
        --header "PRIVATE-TOKEN: $GITOPS_API_TOKEN" \
        --form "source_branch=$GITOPS_BRANCH" \
        --form "target_branch=main" \
        --form "title=chore(staging): deploy backend ${IMAGE_TAG}" \
        --form "description=Created by ${CI_PROJECT_PATH} pipeline ${CI_PIPELINE_URL}. Image: ${IMAGE_NAME}:${IMAGE_TAG}" \
        --form "remove_source_branch=true" \
        "$GITOPS_API_URL/projects/$GITOPS_PROJECT_ID/merge_requests" \
        > merge-request-response.json
    - echo "GitOps MR $(jq -r '.web_url' merge-request-response.json)"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+/'

update_production_gitops:
  image:
    name: mikefarah/yq:4.47.2
    entrypoint: [""]
    docker:
      user: "0"
  stage: gitops
  tags:
    - threepod
    - ci
    - test
    - sonar
  variables:
    GIT_STRATEGY: none
    GITOPS_FILE_ENCODED: "environments%2Fproduction%2Fbackend-image.yaml"
    IMAGE_TAG: "$CI_COMMIT_TAG"
  needs:
    - build_image
  environment:
    name: production
    url: https://api.threepod.langome.academy
  before_script:
    - apk add --no-cache curl jq
    - test -n "$GITOPS_API_TOKEN"
    - test -n "$GITOPS_PROJECT_ID"
    - test -n "$GITOPS_API_URL"
    - echo "$IMAGE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
  script:
    - export GITOPS_BRANCH="gitops/production/backend-${IMAGE_TAG}-${CI_JOB_ID}"
    - |
      curl --fail-with-body --silent --show-error \
        --request POST \
        --header "PRIVATE-TOKEN: $GITOPS_API_TOKEN" \
        --data-urlencode "branch=$GITOPS_BRANCH" \
        --data-urlencode "ref=main" \
        "$GITOPS_API_URL/projects/$GITOPS_PROJECT_ID/repository/branches" \
        > branch-response.json
    - |
      curl --fail-with-body --silent --show-error \
        --header "PRIVATE-TOKEN: $GITOPS_API_TOKEN" \
        --get \
        --data-urlencode "ref=$GITOPS_BRANCH" \
        "$GITOPS_API_URL/projects/$GITOPS_PROJECT_ID/repository/files/$GITOPS_FILE_ENCODED/raw" \
        --output gitops-values.yaml
    - yq -i '.backend.image.tag = strenv(IMAGE_TAG)' gitops-values.yaml
    - test "$(yq '.backend.image.tag' gitops-values.yaml)" = "$IMAGE_TAG"
    - |
      curl --fail-with-body --silent --show-error \
        --request PUT \
        --header "PRIVATE-TOKEN: $GITOPS_API_TOKEN" \
        --form "branch=$GITOPS_BRANCH" \
        --form "commit_message=chore(production): deploy backend ${IMAGE_TAG}" \
        --form "content=<gitops-values.yaml" \
        "$GITOPS_API_URL/projects/$GITOPS_PROJECT_ID/repository/files/$GITOPS_FILE_ENCODED" \
        > commit-response.json
    - |
      curl --fail-with-body --silent --show-error \
        --request POST \
        --header "PRIVATE-TOKEN: $GITOPS_API_TOKEN" \
        --form "source_branch=$GITOPS_BRANCH" \
        --form "target_branch=main" \
        --form "title=chore(production): deploy backend ${IMAGE_TAG}" \
        --form "description=Manual production promotion from ${CI_PROJECT_PATH}. Pipeline: ${CI_PIPELINE_URL}" \
        --form "remove_source_branch=true" \
        "$GITOPS_API_URL/projects/$GITOPS_PROJECT_ID/merge_requests" \
        > merge-request-response.json
    - echo "Production GitOps MR $(jq -r '.web_url' merge-request-response.json)"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
    - when: never

auto_version_tag:
  image: alpine:3.22
  stage: release
  tags:
    - threepod
    - ci
    - test
    - sonar
  resource_group: automatic-version-tag
  before_script:
    - apk add --no-cache curl jq git
    - test -n "$RELEASE_TAG_TOKEN"
  script:
    - |
      MERGE_REQUESTS="$(
        curl --fail-with-body --silent --show-error \
          --header "PRIVATE-TOKEN: $RELEASE_TAG_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/commits/$CI_COMMIT_SHA/merge_requests"
      )"

      SOURCE_BRANCH="$(
        printf '%s' "$MERGE_REQUESTS" |
        jq -r '
          [
            .[]
            | select(.state == "merged" and .target_branch == "main")
          ]
          | sort_by(.merged_at)
          | last
          | .source_branch // empty
        '
      )"

      echo "Merged source branch: $SOURCE_BRANCH"

      case "$SOURCE_BRANCH" in
        hotfix/*)
          BUMP_TYPE="patch"
          ;;
        release/*)
          BUMP_TYPE="minor"
          ;;
        *)
          echo "No automatic tag for source branch: $SOURCE_BRANCH"
          exit 0
          ;;
      esac

      git fetch --tags --force

      LATEST_TAG="$(
        git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname |
        head -n 1
      )"

      if [ -z "$LATEST_TAG" ]; then
        LATEST_TAG="v0.0.0"
      fi

      echo "$LATEST_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'

      VERSION="${LATEST_TAG#v}"
      MAJOR="$(printf '%s' "$VERSION" | cut -d. -f1)"
      MINOR="$(printf '%s' "$VERSION" | cut -d. -f2)"
      PATCH="$(printf '%s' "$VERSION" | cut -d. -f3)"

      case "$BUMP_TYPE" in
        patch)
          PATCH=$((PATCH + 1))
          ;;
        minor)
          MINOR=$((MINOR + 1))
          PATCH=0
          ;;
      esac

      NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"

      echo "Latest tag: $LATEST_TAG"
      echo "Bump type: $BUMP_TYPE"
      echo "New tag: $NEW_TAG"

      curl --fail-with-body --silent --show-error \
        --request POST \
        --header "PRIVATE-TOKEN: $RELEASE_TAG_TOKEN" \
        --data-urlencode "tag_name=$NEW_TAG" \
        --data-urlencode "ref=$CI_COMMIT_SHA" \
        --data-urlencode "message=Automated $BUMP_TYPE release $NEW_TAG" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/tags"

      echo "Created tag $NEW_TAG" 
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never